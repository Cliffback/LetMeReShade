name: Experimental Build

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  experimental-build:
    if: github.event.label.name == 'test-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build plugin
        run: pnpm run build

      - name: Create release package
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          ZIP_NAME="LetUsReShade_experimental_${SHORT_SHA}.zip"
          RELEASE_DIR="LetUsReShade"

          mkdir -p "${RELEASE_DIR}"

          cp -r dist "${RELEASE_DIR}/"
          cp -r defaults "${RELEASE_DIR}/"
          cp main.py "${RELEASE_DIR}/"
          cp package.json "${RELEASE_DIR}/"
          cp plugin.json "${RELEASE_DIR}/"
          cp LICENSE "${RELEASE_DIR}/"
          cp README.md "${RELEASE_DIR}/"

          zip -r "${ZIP_NAME}" "${RELEASE_DIR}"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: experimental-build-${{ env.SHORT_SHA }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Find existing bot comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- experimental-build -->'

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- experimental-build -->
            **Generated Experimental Build**: [Download artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}) (${{ env.SHORT_SHA }})

            <sub>Built on ${{ env.BUILD_DATE }}</sub>

      - name: Remove test-build label
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'test-build'
            });
